<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color: #FEB640; stop-opacity: 0.3" />  <!-- Further reduced brightness -->
      <stop offset="40%" style="stop-color: #FEB640; stop-opacity: 0.1" />
      <stop offset="100%" style="stop-color: #FEB640; stop-opacity: 0" />
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="50" /> <!-- Increased blur -->
    </filter>
  </defs>
  <circle cx="300" cy="300" r="250" fill="url(#sunGradient)" filter="url(#blur)" />
</svg>
